{% extends "base.html" %}

{% block content %}
<h2>Crear Dispositivo</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="name" class="form-label">Nombre del Dispositivo</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>
    
    <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" name="description"></textarea>
    </div>
    
    <div class="mb-3">
        <label for="consumption" class="form-label">Consumo (kWh)</label>
        <input type="number" step="0.01" class="form-control" id="consumption" name="consumption" required>
    </div>
    
    <div class="mb-3">
        <label for="category" class="form-label">Categoría</label>
        <select class="form-select" id="category" name="category">
            <option value="">-- Selecciona una categoría --</option>
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3">
        <label for="zone" class="form-label">Zona</label>
        <select class="form-select" id="zone" name="zone">
            <option value="">-- Selecciona una zona --</option>
            {% for zone in zones %}
            <option value="{{ zone.id }}">{{ zone.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="status" name="status" checked>
        <label class="form-check-label" for="status">Activo</label>
    </div>
    
    <button type="submit" class="btn btn-primary">Crear Dispositivo</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
