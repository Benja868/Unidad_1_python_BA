{% extends "devices/base.html" %}

{% block content %}
<h2>Editar Dispositivo</h2>

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        <label for="name" class="form-label">Nombre del Dispositivo</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ device.name }}" required>
    </div>
    
    <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea class="form-control" id="description" name="description">{{ device.description }}</textarea>
    </div>
    
    <div class="mb-3">
        <label for="consumption" class="form-label">Consumo (kWh)</label>
        <input type="number" step="0.01" class="form-control" id="consumption" name="consumption" value="{{ device.consumption }}" required>
    </div>
    
    <div class="mb-3">
        <label for="category" class="form-label">Categoría</label>
        <select class="form-select" id="category" name="category">
            <option value="">-- Selecciona una categoría --</option>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if device.category and category.id == device.category.id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3">
        <label for="zone" class="form-label">Zona</label>
        <select class="form-select" id="zone" name="zone">
            <option value="">-- Selecciona una zona --</option>
            {% for zone in zones %}
            <option value="{{ zone.id }}" {% if device.zone and zone.id == device.zone.id %}selected{% endif %}>{{ zone.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="status" name="status" {% if device.status %}checked{% endif %}>
        <label class="form-check-label" for="status">Activo</label>
    </div>
    
    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    <a href="{% url 'device_list' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
